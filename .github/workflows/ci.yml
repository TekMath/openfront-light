# openfront-light: one pipeline for the fork. Checks run on every PR and push;
# the light image (Dockerfile.light) is built once they all pass. It is pushed
# to GitHub Container Registry only when a v* tag is pushed, and tagged with
# that version (see the image job). The same tag also creates a GitHub release
# with the prebuilt tarball (openfront-light-<tag>.tar.gz + .sha256). Upstream's
# deploy / release workflows target openfront.io infrastructure and are gone.
name: 🧪 CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - run: npm run lint:github

  prettier:
    name: 🎨 Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - run: npx prettier --check .

  test:
    name: 🔬 Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - run: npm run test:coverage

  typecheck:
    name: 🧩 Typecheck + server bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build-server-light

  gen-maps:
    name: 🗺️ Generated maps up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - uses: actions/setup-go@v7
        with:
          go-version-file: map-generator/go.mod
          cache-dependency-path: map-generator/go.sum
      - run: npm ci
      - run: npm run gen-maps
      - name: Check for diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated maps are out of date — run 'npm run gen-maps' and commit the result."
            git status --short
            git --no-pager diff
            exit 1
          fi

  image:
    name: 🐳 Build and publish image
    needs: [lint, prettier, test, typecheck, gen-maps]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # write: a v* tag also creates the GitHub release carrying the tarball.
      contents: write
      packages: write
    env:
      # Maps embedded in the published image. Override them with the
      # repository variable OPENFRONT_MAPS (Settings > Secrets and variables >
      # Actions > Variables).
      OPENFRONT_MAPS: ${{ vars.OPENFRONT_MAPS || 'world,giantworldmap,europe,northamerica,southamerica,asia,africa' }}
      # Only a pushed v* tag publishes. PRs and main just prove the image builds.
      PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: 🔗 Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🏗️ Build (and push)
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::7}"
          tags=()
          version="$short_sha"
          if [ "$PUSH" = "true" ]; then
            # v1.2.0 -> :v1.2.0 and :latest. A pre-release (v1.2.0-rc.1) only
            # gets its own tag, so :latest always points at a stable release.
            version="$GITHUB_REF_NAME"
            tags+=(--tag "${image}:${version}")
            if [[ "$version" != *-* ]]; then
              tags+=(--tag "${image}:latest")
            fi
          else
            tags+=(--tag "${image}:ci-${short_sha}")
          fi

          args=(
            --file Dockerfile.light
            --platform linux/amd64
            --build-arg "OPENFRONT_MAPS=${OPENFRONT_MAPS}"
            --build-arg "GIT_COMMIT=${version}"
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "org.opencontainers.image.version=${version}"
            --label "org.opencontainers.image.description=openfront-light self-host image (maps: ${OPENFRONT_MAPS})"
            --label "org.opencontainers.image.licenses=AGPL-3.0-only"
            "${tags[@]}"
          )
          if [ "$PUSH" = "true" ]; then
            # Layer cache in the registry: npm ci and the client build only
            # rerun when their inputs change.
            args+=(
              --cache-from "type=registry,ref=${image}:buildcache"
              --cache-to "type=registry,ref=${image}:buildcache,mode=max"
              --push
            )
          fi

          docker buildx create --use --driver docker-container >/dev/null
          docker buildx build "${args[@]}" .
      # The prebuilt tarball (Dockerfile.light `artifact` stage): the same
      # static/ + dist/ as the image, plus deploy/defaults.env and the
      # licenses. It is what cc-openfront downloads to run without Docker.
      - name: 📦 Build release tarball
        if: env.PUSH == 'true'
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="$GITHUB_REF_NAME"
          name="openfront-light-${version}"
          # Same maps, version, platform and layer cache as the image above,
          # so the build stage comes straight from the cache.
          docker buildx build \
            --file Dockerfile.light \
            --target artifact \
            --platform linux/amd64 \
            --build-arg "OPENFRONT_MAPS=${OPENFRONT_MAPS}" \
            --build-arg "GIT_COMMIT=${version}" \
            --cache-from "type=registry,ref=${image}:buildcache" \
            --output "type=local,dest=out/${name}" \
            .
          # One top-level folder, so consumers extract with --strip-components=1.
          tar -C out -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          cat "${name}.tar.gz.sha256"
      - name: 🚀 Create GitHub release
        if: env.PUSH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"
          name="openfront-light-${version}"
          flags=(--generate-notes --verify-tag)
          # Same rule as :latest: a tag with a "-" (v1.2.0-rc.1) is a pre-release.
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$version" "${flags[@]}" \
            --title "$version" \
            "${name}.tar.gz" "${name}.tar.gz.sha256"
      - name: 📝 Summary
        if: env.PUSH == 'true'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "### 🐳 Image published"
            echo ""
            echo "- \`${image}:${GITHUB_REF_NAME}\`"
            if [[ "$GITHUB_REF_NAME" != *-* ]]; then echo "- \`${image}:latest\`"; fi
            echo ""
            echo "Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME} (\`openfront-light-${GITHUB_REF_NAME}.tar.gz\`)"
            echo ""
            echo "Maps: \`${OPENFRONT_MAPS}\`"
          } >> "$GITHUB_STEP_SUMMARY"
