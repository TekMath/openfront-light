# openfront-light: one pipeline for the fork. Checks run on every PR and push;
# the light image (Dockerfile.light) is built once they all pass, and pushed
# to GitHub Container Registry only from main and from v* tags. Upstream's
# deploy / release workflows target openfront.io infrastructure and are gone.
name: 🧪 CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - run: npm run lint:github

  prettier:
    name: 🎨 Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - run: npx prettier --check .

  test:
    name: 🔬 Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - run: npm run test:coverage

  typecheck:
    name: 🧩 Typecheck + server bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build-server-light

  gen-maps:
    name: 🗺️ Generated maps up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Setup npm
        run: npm install --global --ignore-scripts npm@12.1.0
      - uses: actions/setup-go@v7
        with:
          go-version-file: map-generator/go.mod
          cache-dependency-path: map-generator/go.sum
      - run: npm ci
      - run: npm run gen-maps
      - name: Check for diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated maps are out of date — run 'npm run gen-maps' and commit the result."
            git status --short
            git --no-pager diff
            exit 1
          fi

  image:
    name: 🐳 Build and publish image
    needs: [lint, prettier, test, typecheck, gen-maps]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      # Maps embedded in the published image. Override them with the
      # repository variable OPENFRONT_MAPS (Settings > Secrets and variables >
      # Actions > Variables).
      OPENFRONT_MAPS: ${{ vars.OPENFRONT_MAPS || 'world,giantworldmap,europe,northamerica,southamerica,asia,africa' }}
      # Pushes happen from main and v* tags only; PRs just prove the image builds.
      PUSH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: 🔗 Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🏗️ Build (and push)
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::7}"
          tags=(--tag "${image}:sha-${short_sha}")
          case "$GITHUB_REF" in
            refs/heads/main) tags+=(--tag "${image}:latest") ;;
            refs/tags/v*) tags+=(--tag "${image}:${GITHUB_REF_NAME}") ;;
          esac

          args=(
            --file Dockerfile.light
            --platform linux/amd64
            --build-arg "OPENFRONT_MAPS=${OPENFRONT_MAPS}"
            --build-arg "GIT_COMMIT=${short_sha}"
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "org.opencontainers.image.description=openfront-light self-host image (maps: ${OPENFRONT_MAPS})"
            --label "org.opencontainers.image.licenses=AGPL-3.0-only"
            "${tags[@]}"
          )
          if [ "$PUSH" = "true" ]; then
            # Layer cache in the registry: npm ci and the client build only
            # rerun when their inputs change.
            args+=(
              --cache-from "type=registry,ref=${image}:buildcache"
              --cache-to "type=registry,ref=${image}:buildcache,mode=max"
              --push
            )
          fi

          docker buildx create --use --driver docker-container >/dev/null
          docker buildx build "${args[@]}" .
      - name: 📝 Summary
        if: env.PUSH == 'true'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "### 🐳 Image published"
            echo ""
            echo "- \`${image}:sha-${GITHUB_SHA::7}\`"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then echo "- \`${image}:latest\`"; fi
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "- \`${image}:${GITHUB_REF_NAME}\`"; fi
            echo ""
            echo "Maps: \`${OPENFRONT_MAPS}\`"
          } >> "$GITHUB_STEP_SUMMARY"
